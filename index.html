// ---------------------------------------------------------
// DECISION MAP: branching trees. The first box is how you approach something,
// each child is a choice, and every choice spiders into its own line of
// consequences. Node: { type: decision|choice|result|unknown, label, note,
// taken, children[] }. `taken` marks the path you actually played.
// ---------------------------------------------------------
let currentTree = 0;
function renderDecisionMap(phase){
  const main = document.getElementById('main');
  const trees = phase.trees || [];
  if(currentTree >= trees.length) currentTree = 0;
  main.innerHTML = `
    <div class="phase-head"><div>
      <div class="num">${phase.label || 'PHASE ' + phase.number}</div>
      <h2>${phase.title}</h2>
    </div></div>
    ${phase.intro ? '<p class="tree-intro">' + phase.intro + '</p>' : ''}
    <div class="tree-tabs">${trees.map((t, i) => '<button class="tree-tab' + (i === currentTree ? ' active' : '') + '" data-i="' + i + '">' + t.title + '</button>').join('')}</div>
    <div class="tree-tools"><button class="btn-sm" id="newMapBtn">+ new map</button>${trees.length ? '<button class="btn-sm" id="renameMapBtn">rename map</button><button class="btn-sm danger" id="deleteMapBtn">delete map</button>' : ''}</div>
    <div class="tree-legend"><span class="lg l-decision">Decision</span><span class="lg l-choice">Choice</span><span class="lg l-result">Outcome</span><span class="lg l-unknown">Not yet explored</span><span class="lg l-taken">Path you played</span></div>
    <div class="tree-scroll"><div class="tree" id="tree"></div></div>
    <div class="tree-detail" id="treeDetail">Hover a box to trace its path. Tap one to read the details or add what happens next.</div>`;
  main.querySelectorAll('.tree-tab').forEach(b => b.addEventListener('click', () => { currentTree = +b.dataset.i; renderDecisionMap(phase); }));
  const pi = DATA.phases.indexOf(phase);
  document.getElementById('newMapBtn').addEventListener('click', () => openTreeMapModal({ mode: 'new', pi }));
  if(trees.length){
    document.getElementById('renameMapBtn').addEventListener('click', () => openTreeMapModal({ mode: 'rename', pi, ti: currentTree }));
    document.getElementById('deleteMapBtn').addEventListener('click', () => openTreeMapModal({ mode: 'delete', pi, ti: currentTree }));
    drawTree(trees[currentTree].root, { pi, ti: currentTree });
  }
}

function drawTree(root, ctx){
  const NS = 'http://www.w3.org/2000/svg';
  const W = 220, H = 96, GX = 72, GY = 14;
  const nodes = []; let leaf = 0, maxD = 0;
  (function walk(n, d, parent){
    const r = { n, d, parent, kids: [], id: nodes.length, path: parent ? parent.path.concat(parent.kids.length) : [] };
    nodes.push(r); if(parent) parent.kids.push(r); maxD = Math.max(maxD, d);
    (n.children || []).forEach(k => walk(k, d + 1, r));
    r.y = r.kids.length ? (r.kids[0].y + r.kids[r.kids.length - 1].y) / 2 : leaf++;
  })(root, 0, null);

  const host = document.getElementById('tree');
  host.style.width  = ((maxD + 1) * W + maxD * GX) + 'px';
  host.style.height = (leaf * H + (leaf - 1) * GY) + 'px';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', host.style.width.replace('px','')); svg.setAttribute('height', host.style.height.replace('px',''));
  host.appendChild(svg);

  const pos = r => ({ x: r.d * (W + GX), y: r.y * (H + GY) });
  nodes.forEach(r => {
    if(!r.parent) return;
    const a = pos(r.parent), b = pos(r), c = GX * 0.55;
    const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2;
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', `M${x1} ${y1} C${x1 + c} ${y1} ${x2 - c} ${y2} ${x2} ${y2}`);
    p.setAttribute('class', 'edge' + (r.n.type === 'unknown' ? ' unk' : '') + (r.n.taken ? ' taken' : ''));
    svg.appendChild(p); r.edge = p;
    if(r.n.type !== 'unknown'){
      const len = p.getTotalLength();
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        p.style.transition = 'stroke-dashoffset .7s ease ' + (r.d * 0.16) + 's';
        p.style.strokeDashoffset = 0;
      }));
    }
  });

  const tags = { decision: 'Decision', choice: 'Choice', result: 'Outcome', unknown: 'Unexplored' };
  let selected = null;
  const focus = r => {
    const keep = new Set(); for(let c = r; c; c = c.parent) keep.add(c.id);
    (function down(x){ x.kids.forEach(k => { keep.add(k.id); down(k); }); })(r);
    nodes.forEach(x => { x.el.classList.toggle('dim', !keep.has(x.id)); if(x.edge) x.edge.classList.toggle('dim', !keep.has(x.id)); });
  };
  const clear = () => nodes.forEach(x => { x.el.classList.remove('dim'); if(x.edge) x.edge.classList.remove('dim'); });
  const detail = r => {
    const trail = []; for(let c = r; c; c = c.parent) trail.unshift(c.n.label);
    const box = document.getElementById('treeDetail'); box.textContent = '';
    const t = document.createElement('div'); t.className = 'trail'; t.textContent = trail.join('  \u2192  ');
    box.appendChild(t);
    if(r.n.note){ const d = document.createElement('div'); d.className = 'dnote'; d.textContent = r.n.note; box.appendChild(d); }
    const row = document.createElement('div'); row.className = 'tree-actions';
    const mk = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn-sm ' + cls; b.textContent = label; b.addEventListener('click', fn); row.appendChild(b); };
    mk('+ add what happens next', '', () => openTreeNodeModal({ mode: 'add', ctx, path: r.path, node: r.n }));
    mk('edit this box', '', () => openTreeNodeModal({ mode: 'edit', ctx, path: r.path, node: r.n }));
    if(r.path.length) mk('delete this box', 'danger', () => openTreeNodeModal({ mode: 'delete', ctx, path: r.path, node: r.n }));
    box.appendChild(row);
  };

  nodes.forEach(r => {
    const type = r.n.type || 'choice', p = pos(r);
    const el = document.createElement('div');
    el.className = 'tnode t-' + type + (r.n.taken ? ' taken' : '');
    el.style.cssText = `left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px;animation-delay:${r.d * 0.16}s`;
    el.tabIndex = 0; el.setAttribute('role', 'button');
    const tag = document.createElement('div'); tag.className = 'ttag'; tag.textContent = tags[type] || type;
    const tx  = document.createElement('div'); tx.className = 'ttext'; tx.textContent = r.n.label;
    el.append(tag, tx); host.appendChild(el); r.el = el;
    el.addEventListener('mouseenter', () => focus(r));
    el.addEventListener('mouseleave', () => selected ? focus(selected) : clear());
    el.addEventListener('click', () => { selected = r; focus(r); detail(r); });
    el.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
  });
}

// ---------------------------------------------------------
// DECISION MAP EDITING. Each save re-reads the latest data.json from GitHub,
// applies just that one change, and commits it, so two people editing at
// different times don't overwrite each other's work.
// ---------------------------------------------------------
function getAt(root, path){
  let n = root;
  for(const i of path){
    n = (n.children || [])[i];
    if(!n) throw new Error('that box changed since you loaded the page. refresh and try again.');
  }
  return n;
}

async function mutateAndCommit(token, message, mutator){
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;
  for(let attempt = 0; attempt < 3; attempt++){
    const res = await fetch(url, { headers: { Authorization: `token ${token}` }, cache: 'no-store' });
    if(!res.ok) throw new Error('could not read data.json (check the token and repo name)');
    const j = await res.json();
    const data = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
    mutator(data);
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const put = await fetch(url, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, content, sha: j.sha })
    });
    if(put.ok) return data;
    if(put.status !== 409 && put.status !== 422){
      const e = await put.json().catch(() => ({}));
      throw new Error(e.message || 'GitHub rejected the save');
    }
  }
  throw new Error('someone else saved at the same moment. try again.');
}

function treeModalShell(title, bodyHtml, confirmLabel, onSave){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <h3>${title}</h3>
        <div class="field">
          <label>Github token (write access to this repo)</label>
          <input type="password" id="tToken" placeholder="paste your token">
          <div class="token-note"><label><input type="checkbox" id="tRemember"> remember on this device</label></div>
        </div>
        ${bodyHtml}
        <div id="modalStatus"></div>
        <div class="modal-actions">
          <button id="cancelBtn">Cancel</button>
          <button id="saveBtn">${confirmLabel}</button>
        </div>
      </div>
    </div>`;
  const saved = localStorage.getItem('gh_token');
  if(saved){ document.getElementById('tToken').value = saved; document.getElementById('tRemember').checked = true; }
  document.getElementById('overlay').addEventListener('click', e => { if(e.target.id === 'overlay') root.innerHTML = ''; });
  document.getElementById('cancelBtn').addEventListener('click', () => root.innerHTML = '');
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const token = document.getElementById('tToken').value.trim();
    const status = document.getElementById('modalStatus');
    if(!token){ status.innerHTML = '<div class="status-msg err">token required.</div>'; return; }
    if(document.getElementById('tRemember').checked) localStorage.setItem('gh_token', token);
    else localStorage.removeItem('gh_token');
    status.innerHTML = '<div class="status-msg">saving…</div>';
    try{
      await onSave(token);
      status.innerHTML = '<div class="status-msg ok">saved! everyone sees it after the site refreshes (about a minute).</div>';
      setTimeout(() => { root.innerHTML = ''; }, 1200);
    }catch(e){
      status.innerHTML = '<div class="status-msg err">' + e.message + '</div>';
    }
  });
}

function openTreeNodeModal({ mode, ctx, path, node }){
  const rootOf = d => d.phases[ctx.pi].trees[ctx.ti].root;
  const finish = d => { DATA = d; renderMain(); };
  if(mode === 'delete'){
    treeModalShell('Delete this box?',
      '<p style="font-size:13px;">This removes "' + escapeAttr(node.label) + '" and everything that branches from it, for everyone.</p>',
      'Delete',
      async token => finish(await mutateAndCommit(token, 'Decision map: delete a box', data => {
        const parent = getAt(rootOf(data), path.slice(0, -1));
        parent.children.splice(path[path.length - 1], 1);
        if(!parent.children.length) delete parent.children;
      })));
    return;
  }
  const isEdit = mode === 'edit';
  const defType = isEdit ? (node.type || 'choice') : ({ decision: 'choice', choice: 'result', result: 'decision', unknown: 'choice' }[node.type] || 'choice');
  const v = isEdit ? Object.assign({}, node, { note: /^Not played yet/.test(node.note || '') ? '' : node.note }) : { label: '', note: '', taken: false };
  const opts = [['decision', 'Decision (a question or approach)'], ['choice', 'Choice (an option you can pick)'], ['result', 'Outcome (what happens)'], ['unknown', 'Not yet explored']]
    .map(o => `<option value="${o[0]}" ${o[0] === defType ? 'selected' : ''}>${o[1]}</option>`).join('');
  const body = `
    <p style="font-size:13px; margin:0 0 10px;">${isEdit ? 'Editing' : 'Adding after'}: <b>${escapeAttr(node.label)}</b></p>
    <div class="field"><label>Type</label><select id="tType">${opts}</select></div>
    <div class="field"><label>What it says</label><input type="text" id="tLabel" placeholder="e.g. Interrupt her to demand the plunger" value="${escapeAttr(v.label)}"></div>
    <div class="field"><label>Details (optional)</label><textarea id="tNote" placeholder="What happens, or anything worth remembering">${escapeAttr(v.note || '')}</textarea></div>
    <div class="field"><label><input type="checkbox" id="tTaken" ${v.taken ? 'checked' : ''}> I played this path (lights it up in gold)</label></div>`;
  treeModalShell(isEdit ? 'Edit this box' : 'Add what happens next', body, 'Save to GitHub', async token => {
    const type = document.getElementById('tType').value;
    const label = document.getElementById('tLabel').value.trim();
    const note = document.getElementById('tNote').value.trim();
    const taken = document.getElementById('tTaken').checked;
    if(!label) throw new Error('write what the box says first.');
    finish(await mutateAndCommit(token, (isEdit ? 'Decision map: edit a box' : 'Decision map: add a box'), data => {
      const target = getAt(rootOf(data), path);
      const apply = o => { o.type = type; o.label = label; note ? o.note = note : delete o.note; taken ? o.taken = true : delete o.taken; };
      if(isEdit) apply(target);
      else { const kid = {}; apply(kid); (target.children = target.children || []).push(kid); }
    }));
  });
}

function openTreeMapModal({ mode, pi, ti }){
  const trees = DATA.phases[pi].trees || [];
  if(mode === 'delete'){
    treeModalShell('Delete this map?',
      '<p style="font-size:13px;">This removes the whole "' + escapeAttr(trees[ti].title) + '" map for everyone.</p>', 'Delete',
      async token => { const d = await mutateAndCommit(token, 'Decision map: delete a map', data => { data.phases[pi].trees.splice(ti, 1); }); currentTree = 0; DATA = d; renderMain(); });
    return;
  }
  const isNew = mode === 'new';
  const body = `
    <div class="field"><label>Map name</label><input type="text" id="tTitle" placeholder="e.g. The bank job" value="${isNew ? '' : escapeAttr(trees[ti].title)}"></div>
    ${isNew ? '<div class="field"><label>First box: how do you do something?</label><input type="text" id="tFirst" placeholder="e.g. Get into the vault"></div>' : ''}`;
  treeModalShell(isNew ? 'New decision map' : 'Rename map', body, 'Save to GitHub', async token => {
    const title = document.getElementById('tTitle').value.trim();
    const first = isNew ? document.getElementById('tFirst').value.trim() : '';
    if(!title || (isNew && !first)) throw new Error('fill in both boxes first.');
    const d = await mutateAndCommit(token, isNew ? 'Decision map: new map' : 'Decision map: rename map', data => {
      const list = data.phases[pi].trees;
      if(isNew) list.push({ title, root: { type: 'decision', label: first, taken: true } });
      else list[ti].title = title;
    });
    if(isNew) currentTree = d.phases[pi].trees.length - 1;
    DATA = d; renderMain();
  });
}
